services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: lethe-hydradb
    # The image runs as UID/GID 10001 by default, but the bind-mounted
    # .hydradb-data below is owned by whichever host user created it. Without
    # matching that here, the container can't write its store/cache and every
    # write query fails with "Permission denied" -- this exactly matches the
    # HydraDB README's own `docker run --user "$(id -u):$(id -g)"` recipe.
    # DOCKER_UID/DOCKER_GID are exported by scripts/hydradb-up.sh.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "7687:7687" # Bolt
      - "8443:8443" # HTTP query API (used by this app)
      - "9090:9090" # admin: /readyz, /metrics
    volumes:
      - ./.hydradb-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
